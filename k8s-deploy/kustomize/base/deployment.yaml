kind: Deployment
apiVersion: apps/v1
metadata:
  name: it-services-portal
  labels:
    app: it-services-portal
spec:
  selector:
    matchLabels:
      app: it-services-portal
  template:
    metadata:
      labels:
        app: it-services-portal
    spec:
      containers:
      - name: it-services-portal
        image: lerndevops/it-services-portal:latest
        ports:
        - name: http
          containerPort: 8080
